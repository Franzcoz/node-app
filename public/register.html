<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Wallet - Registrarse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" type="image/png" href="/img/icon.svg">
</head>
<body>
    <div class="container p-2">
        <div id="tarjeta" class="bg-main align-content-end p-4 rounded-2 w-75 overflow-scroll" style="height: 88%;">
            <div class="my-4 p-1 rounded-5">
                <h2 class="text-center"><a class="text-main-link" style="text-decoration: none; "href="/">Cool Wallet</a></h2>
                <h3 class="text-center">Registrar Usuario</h3>
            </div>
            <form id="register-form">
                <div class="row">
                    <div class="col-12 col-md-6">
                        <label for="user">Usuario</label>
                        <input class="form-control rounded-5" type="text" maxlength="15" id="user" required name="user">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="name">Nombre</label>
                        <input class="form-control rounded-5" type="text" id="name" maxlength="50" required name="name">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="lastname">Apellido 1</label>
                        <input class="form-control rounded-5" type="text" id="lastname1" maxlength="50" required name="lastname">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="lastname">Apellido 2</label>
                        <input class="form-control rounded-5" type="text" id="lastname2" maxlength="50" name="lastname">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="passwd">Correo electrónico</label>
                        <input class="form-control rounded-5" type="email" name="email" maxlength="50" required id="email">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="passwd">Contraseña</label>
                        <input class="form-control rounded-5" type="password" name="passwd" maxlength="12" required id="passwd">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="re-passwd">Repita Contraseña</label>
                        <input class="form-control rounded-5" type="password" name="passwd" maxlength="12" required id="re-passwd">
                    </div>
                </div>
                <button id="register-btn" type="submit" disabled="true" class="btn btn-main m-3 rounded-5">Enviar</button>
            </form>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/js/register.js"></script>
</body>
</html>
